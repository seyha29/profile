kind = "web"
previewPath = "/"
title = "SEYHA — Developer Portfolio"
description = "A polished, responsive personal portfolio for SEYHA, featuring projects, skills, experience, services, and honest GitHub and contact placeholders."
version = "1.0.0"
id = "artifacts/seyha-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19466

[services.development]
run = "pnpm --filter @workspace/seyha-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/seyha-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/seyha-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19466"
BASE_PATH = "/"
